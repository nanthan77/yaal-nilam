            --shadow-xl: 0 20px 50px rgba(0,0,0,0.12);
            --radius: 12px;

            --radius-xl: 24px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);

        body {

        .tamil { font-family: 'Noto Sans Tamil', 'Inter', sans-serif; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: var(--primary-light); border-radius: 4px; }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        .fade-in { animation: fadeIn 0.6s ease-out; }
        .slide-in { animation: slideIn 0.5s ease-out; }

        /* Layout */
        .container { max-width: 1400px; margin: 0 auto; padding: 0 24px; }

        /* Buttons */
        .btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 12px 24px; border-radius: var(--radius); font-weight: 600;
            font-size: 14px; cursor: pointer; transition: var(--transition);
            border: none; text-decoration: none;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-light); transform: translateY(-1px); box-shadow: var(--shadow-lg); }
        .btn-accent { background: var(--accent); color: var(--primary-dark); }
        .btn-accent:hover { background: var(--accent-light); transform: translateY(-1px); }
        .btn-outline { background: transparent; color: var(--primary); border: 2px solid var(--primary); }
        .btn-outline:hover { background: var(--primary); color: white; }
        .btn-ghost { background: transparent; color: var(--text-light); }
        .btn-ghost:hover { background: rgba(0,0,0,0.05); }
        .btn-sm { padding: 8px 16px; font-size: 13px; }
        .btn-lg { padding: 16px 32px; font-size: 16px; }
        .btn-icon { width: 40px; height: 40px; padding: 0; display: flex; align-items: center; justify-content: center; border-radius: 50%; }

        /* Form Elements */
        .input, .select {
            width: 100%; padding: 12px 16px; border: 1.5px solid var(--border);
            border-radius: var(--radius); font-size: 14px; font-family: inherit;
            transition: var(--transition); background: white; color: var(--text);
        }
        .input:focus, .select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(27,77,62,0.1); }
        .input::placeholder { color: var(--text-lighter); }
        label { font-size: 13px; font-weight: 600; color: var(--text-light); margin-bottom: 6px; display: block; }

        /* Cards */
        .card {
            background: var(--bg-card); border-radius: var(--radius-lg);
            box-shadow: var(--shadow); overflow: hidden; transition: var(--transition);
        }
        .card:hover { box-shadow: var(--shadow-lg); transform: translateY(-4px); }

        /* Badge */
        .badge {
            display: inline-flex; align-items: center; padding: 4px 12px;
            border-radius: 20px; font-size: 12px; font-weight: 600;
        }
        .badge-green { background: #ECFDF5; color: #065F46; }
        .badge-blue { background: #EFF6FF; color: #1E40AF; }
        .badge-amber { background: #FFFBEB; color: #92400E; }
        .badge-red { background: #FEF2F2; color: #991B1B; }

        /* Grid */
        .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }

        /* Map container */
        #property-map { width: 100%; height: 500px; border-radius: var(--radius-lg); z-index: 1; }
        .leaflet-popup-content-wrapper { border-radius: var(--radius) !important; }

        /* Modal */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px); z-index: 1000;
            display: flex; align-items: center; justify-content: center;
            animation: fadeIn 0.2s ease;
        }
        .modal {
            background: white; border-radius: var(--radius-xl); padding: 40px;
            max-width: 500px; width: 90%; max-height: 90vh; overflow-y: auto;
            box-shadow: var(--shadow-xl);
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .grid-4 { grid-template-columns: repeat(2, 1fr); }
            .grid-3 { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 640px) {
            .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; }
            .container { padding: 0 16px; }
            .hide-mobile { display: none !important; }
        }

        /* Image gallery */
        .gallery-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 4px; border-radius: var(--radius-lg); overflow: hidden; height: 450px; }
        .gallery-grid .main-img { width: 100%; height: 100%; object-fit: cover; cursor: pointer; }
        .gallery-side { display: grid; grid-template-rows: 1fr 1fr; gap: 4px; }
        .gallery-side img { width: 100%; height: 100%; object-fit: cover; cursor: pointer; }
        @media (max-width: 640px) { .gallery-grid { grid-template-columns: 1fr; height: 300px; } .gallery-side { display: none; } }

        /* Property detail stats */
        .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
        .stat-item { text-align: center; padding: 16px; background: #F9FAFB; border-radius: var(--radius); }
        .stat-value { font-size: 24px; font-weight: 700; color: var(--primary); }
        .stat-label { font-size: 12px; color: var(--text-light); margin-top: 4px; }
        @media (max-width: 640px) { .stat-grid { grid-template-columns: repeat(2, 1fr); } }

        /* Tabs */
        .tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--border); padding-bottom: 0; }
        .tab { padding: 12px 20px; font-weight: 500; color: var(--text-light); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: var(--transition); }
        .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
        .tab:hover { color: var(--primary); }

        /* Skeleton loading */
        .skeleton { background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: var(--radius); }

        /* Toast */
        .toast {
            position: fixed; bottom: 24px; right: 24px; padding: 16px 24px;
            background: var(--primary-dark); color: white; border-radius: var(--radius);
            box-shadow: var(--shadow-xl); z-index: 2000; animation: slideIn 0.3s ease;
            display: flex; align-items: center; gap: 12px;
        }

        /* === PROPTECH ENHANCEMENTS === */

        /* Pathway Segmentation Tabs */
        .pathway-tabs { display: flex; gap: 0; background: rgba(255,255,255,0.15); border-radius: var(--radius); overflow: hidden; max-width: 500px; margin: 0 auto 32px; }
        .pathway-tab { flex: 1; padding: 14px 24px; text-align: center; font-weight: 600; font-size: 15px; cursor: pointer; transition: var(--transition); color: rgba(255,255,255,0.7); border: none; background: none; font-family: inherit; }
        .pathway-tab.active { background: white; color: var(--primary); border-radius: var(--radius); box-shadow: var(--shadow); }
        .pathway-tab:hover:not(.active) { color: white; background: rgba(255,255,255,0.1); }

        /* Testimonial Section */
        .testimonial-card { padding: 32px; background: white; border-radius: var(--radius-lg); box-shadow: var(--shadow); position: relative; }
        .testimonial-card::before { content: '"'; position: absolute; top: 16px; left: 24px; font-size: 60px; color: var(--primary); opacity: 0.15; font-family: Georgia, serif; line-height: 1; }
        .testimonial-avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent); }

        /* Neighborhood Guide */
        .neighborhood-card { padding: 24px; background: white; border-radius: var(--radius-lg); box-shadow: var(--shadow); transition: var(--transition); border-left: 4px solid var(--primary); }
        .neighborhood-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); }
        .neighborhood-stat { display: flex; align-items: center; gap: 8px; padding: 8px 0; font-size: 14px; color: var(--text-light); }

        /* Mortgage Calculator */
        .calc-container { background: white; border-radius: var(--radius-xl); box-shadow: var(--shadow-lg); padding: 40px; max-width: 500px; }
        .calc-result { background: linear-gradient(135deg, var(--primary-dark), var(--primary)); color: white; border-radius: var(--radius-lg); padding: 24px; text-align: center; margin-top: 24px; }

        .chatbot-fab { position: fixed; bottom: 24px; right: 24px; width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: white; border: none; cursor: pointer; box-shadow: 0 4px 20px rgba(27,77,62,0.4); z-index: 1500; display: flex; align-items: center; justify-content: center; transition: var(--transition); }

        .whatsapp-fab { position: fixed; bottom: 96px; right: 24px; width: 52px; height: 52px; border-radius: 50%; background: #25D366; color: white; border: none; cursor: pointer; box-shadow: 0 4px 16px rgba(37,211,102,0.4); z-index: 1400; display: flex; align-items: center; justify-content: center; transition: var(--transition); }

        /* Progress Bar for Forms */
        .progress-bar { display: flex; gap: 4px; margin-bottom: 24px; }
        .progress-step { flex: 1; height: 4px; border-radius: 2px; background: #E5E7EB; transition: var(--transition); }
        .progress-step.active { background: var(--primary); }
        .progress-step.done { background: var(--accent); }

        /* Schedule Tour Button */
        .btn-tour { background: linear-gradient(135deg, var(--accent), #E8C97A); color: var(--primary-dark); font-weight: 700; box-shadow: 0 4px 12px rgba(212,168,83,0.3); }

        .recently-viewed { background: white; border-top: 1px solid var(--border); padding: 16px 0; overflow-x: auto; white-space: nowrap; }
        .recently-viewed-item { display: inline-flex; align-items: center; gap: 12px; padding: 8px 16px; margin-right: 12px; border-radius: var(--radius); border: 1px solid var(--border); cursor: pointer; transition: var(--transition); vertical-align: top; white-space: normal; max-width: 280px; }

        /* Enhanced Mobile */

        @keyframes slideDrawer { from { transform: translateX(100%); } to { transform: translateX(0); } }
        .mobile-nav-item { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: var(--radius); cursor: pointer; transition: var(--transition); font-size: 15px; font-weight: 500; color: var(--text); border: none; background: none; width: 100%; text-align: left; font-family: inherit; }
        .mobile-nav-item:hover, .mobile-nav-item.active { background: rgba(27,77,62,0.08); color: var(--primary); }

            .chatbot-window { width: calc(100vw - 32px); right: 16px; bottom: 88px; }
            .pathway-tabs { max-width: 100%; }
            .pathway-tab { padding: 10px 12px; font-size: 13px; }
            .whatsapp-fab { bottom: 88px; right: 16px; }
            .chatbot-fab { bottom: 16px; right: 16px; }
        }
    </style>

  const properties = [];
  for (let i = 0; i < 24; i++) {
    const area = JAFFNA_AREAS[i % JAFFNA_AREAS.length];
    const type = types[i % types.length];
    const listingType = listingTypes[i % 5 === 0 ? 2 : i % 3 === 0 ? 1 : 0];
    const beds = type === 'land' ? 0 : Math.floor(Math.random() * 4) + 2;
    const baths = type === 'land' ? 0 : Math.floor(Math.random() * 3) + 1;
    const sqft = type === 'land' ? 0 : Math.floor(Math.random() * 2000) + 800;
    const perches = Math.floor(Math.random() * 40) + 5;
    const basePrice = type === 'land' ? perches * 800000 : type === 'villa' ? 35000000 + Math.random() * 30000000 : type === 'commercial' ? 15000000 + Math.random() * 25000000 : 8000000 + Math.random() * 25000000;

    // Select images mapped to type
    const typeImages = PROPERTY_IMAGES_MAP[type] || PROPERTY_IMAGES_MAP['house'];

      type,

// ─────────────────────────────────────────

function formatPrice(price, listingType, lang) {
  const suffix = listingType === 'shortterm' ? (lang === 'ta' ? '/இரவு' : '/night') : listingType === 'rent' ? (lang === 'ta' ? '/மாதம்' : '/mo') : '';
  if (price >= 1000000) {
    return `Rs. ${(price / 1000000).toFixed(1)}M${suffix}`;
  }
  return `Rs. ${price.toLocaleString()}${suffix}`;
}

// ─────────────────────────────────────────
// PROPERTIES LIST PAGE
// ─────────────────────────────────────────
function PropertiesPage() {
  const { lang, t, searchQuery, activePathway } = useContext(AppContext);
  const [filters, setFilters] = useState({ type: 'all', listingType: 'all', minPrice: '', maxPrice: '', beds: 'any', baths: 'any', area: 'all', pets: 'all', leaseTerm: 'all', furnished: 'all' });
  const [sortBy, setSortBy] = useState('newest');
  const [showFilters, setShowFilters] = useState(false);

  // Sync pathway to listingType filter
  useEffect(() => {
    if (activePathway) setFilters(f => ({ ...f, listingType: activePathway }));
  }, [activePathway]);

  const filtered = useMemo(() => {
    let result = [...ALL_PROPERTIES];
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      result = result.filter(p => p.title.toLowerCase().includes(q) || p.area.toLowerCase().includes(q) || p.areaTa.includes(q) || p.titleTa.includes(q) || p.type.toLowerCase().includes(q));
    }
    if (filters.type !== 'all') result = result.filter(p => p.type === filters.type);
    if (filters.listingType !== 'all') result = result.filter(p => p.listingType === filters.listingType);
    if (filters.minPrice) result = result.filter(p => p.price >= Number(filters.minPrice));
    if (filters.maxPrice) result = result.filter(p => p.price <= Number(filters.maxPrice));
    if (filters.beds !== 'any') result = result.filter(p => p.beds >= Number(filters.beds));
    if (filters.baths !== 'any') result = result.filter(p => p.baths >= Number(filters.baths));
    if (filters.area !== 'all') result = result.filter(p => p.area === filters.area);
    if (filters.pets === 'yes') result = result.filter(p => p.petsAllowed);
    if (filters.pets === 'no') result = result.filter(p => !p.petsAllowed);
    if (filters.leaseTerm !== 'all') result = result.filter(p => p.leaseTerm === filters.leaseTerm);
    if (filters.furnished === 'yes') result = result.filter(p => p.furnished);
    if (filters.furnished === 'no') result = result.filter(p => !p.furnished);

    if (sortBy === 'priceLow') result.sort((a, b) => a.price - b.price);
    else if (sortBy === 'priceHigh') result.sort((a, b) => b.price - a.price);
    else result.sort((a, b) => a.daysAgo - b.daysAgo);
    return result;
  }, [filters, sortBy, searchQuery]);

  return (
    <div className="container" style={{ padding: '40px 24px' }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 24, flexWrap: 'wrap', gap: 16 }}>
        <div>
          <h1 className={lang === 'ta' ? 'tamil' : ''} style={{ fontSize: 28, fontWeight: 800 }}>{t('properties')}</h1>
          <p style={{ color: 'var(--text-light)', fontSize: 14 }}>{filtered.length} {t('propertiesFound')}</p>
        </div>
        <div style={{ display: 'flex', gap: 12, alignItems: 'center' }}>
          <button onClick={() => setShowFilters(!showFilters)} className="btn btn-outline btn-sm">
            <Icon name="filter" size={16} /> {t('filterBy')}
          </button>
          <select className="select" style={{ width: 180 }} value={sortBy} onChange={e => setSortBy(e.target.value)}>

function MapPage() {
  const { lang, t, setPage, setSelectedProperty } = useContext(AppContext);
  const mapRef = useRef(null);
  const mapInstance = useRef(null);

  useEffect(() => {
    if (!mapRef.current || mapInstance.current) return;
    const map = L.map(mapRef.current).setView([9.6615, 80.0255], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    ALL_PROPERTIES.forEach(p => {
      const marker = L.marker([p.lat, p.lng]).addTo(map);
      marker.bindPopup(`
        <div style="min-width:200px;font-family:Inter,sans-serif;">
          <img src="${p.images[0]}" style="width:100%;height:120px;object-fit:cover;border-radius:8px;margin-bottom:8px;" />
          <h3 style="font-size:14px;font-weight:700;margin-bottom:4px;">${lang === 'ta' ? p.titleTa : p.title}</h3>
          <p style="font-size:18px;font-weight:800;color:#1B4D3E;margin-bottom:4px;">${formatPrice(p.price, p.listingType, lang)}</p>
          <p style="font-size:12px;color:#6B7280;">${p.type !== 'land' ? p.beds + ' beds · ' + p.baths + ' baths · ' + p.sqft + ' sqft' : p.perches + ' perches'}</p>
        </div>
      `);
      marker.on('click', () => {});
    });

    mapInstance.current = map;
    return () => { if (mapInstance.current) { mapInstance.current.remove(); mapInstance.current = null; } };
  }, [lang]);

  return (
    <div className="container" style={{ padding: '40px 24px' }}>
      <h1 className={lang === 'ta' ? 'tamil' : ''} style={{ fontSize: 28, fontWeight: 800, marginBottom: 8 }}>{t('map')}</h1>
      <p style={{ color: 'var(--text-light)', marginBottom: 24 }}>{lang === 'ta' ? 'வரைபடத்தில் சொத்துக்களை ஆராயுங்கள்' : 'Explore properties on the map'}</p>
      <div id="property-map" ref={mapRef} style={{ height: 600, borderRadius: 'var(--radius-lg)', boxShadow: 'var(--shadow-lg)' }} />
    </div>
  );
}

              <a href={`tel:${agent.phone}`} className="btn btn-primary" style={{ textDecoration: 'none' }}><Icon name="phone" size={16} /> {agent.phone}</a>
              <a href={`mailto:${agent.email}`} className="btn btn-outline" style={{ textDecoration: 'none' }}><Icon name="mail" size={16} /> {t('sendMessage')}</a>

}

// ADD LISTING PAGE
// ─────────────────────────────────────────
function AddListingPage() {
  const { lang, t, setToast, setPage } = useContext(AppContext);
  const [formStep, setFormStep] = useState(1);
  const totalSteps = 3;

  const handleSubmit = (e) => {
    e.preventDefault();
    if (formStep < totalSteps) { 
      setFormStep(formStep + 1); 
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return; 
    }
    setToast(lang === 'ta' ? 'சொத்து வெற்றிகரமாக பதிவிடப்பட்டது!' : 'Property listed successfully!');
    setPage('properties');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  const prevStep = () => {
    if (formStep > 1) {
      setFormStep(formStep - 1);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  };

  return (
    <div style={{ minHeight: '100vh', background: 'var(--bg)', padding: '60px 24px', display: 'flex', justifyContent: 'center' }}>
      <div style={{ width: '100%', maxWidth: 800 }}>
        
        <div style={{ textAlign: 'center', marginBottom: 40 }} className="fade-in">
          <h1 className={lang === 'ta' ? 'tamil' : ''} style={{ fontSize: 36, fontWeight: 900, color: 'var(--primary-dark)', marginBottom: 12 }}>
            {t('postProperty')}
          </h1>
          <p style={{ fontSize: 16, color: 'var(--text-light)', maxWidth: 500, margin: '0 auto' }}>
            {lang === 'ta' 
              ? 'உங்கள் சொத்தை ஆயிரக்கணக்கான வாங்குபவர்களுக்கு சில எளிய படிகளில் காட்சிப்படுத்துங்கள்.' 
              : 'Showcase your property to thousands of buyers in just a few simple steps.'}
          </p>
        </div>

        {/* Progress Tracker */}
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 40, position: 'relative' }}>
          <div style={{ position: 'absolute', top: 20, left: '10%', right: '10%', height: 3, background: 'var(--border)', zIndex: 0 }} />
          <div style={{ position: 'absolute', top: 20, left: '10%', right: '10%', height: 3, background: 'var(--primary)', zIndex: 0, width: `${((formStep - 1) / (totalSteps - 1)) * 80}%`, transition: 'width 0.4s ease' }} />
          
          {[
            { step: 1, label: lang === 'ta' ? 'அடிப்படை' : 'Basics' },
            { step: 2, label: lang === 'ta' ? 'விவரங்கள்' : 'Details' },
            { step: 3, label: lang === 'ta' ? 'படங்கள்' : 'Media' }

            const isActive = formStep === s.step;
            const isDone = formStep > s.step;

              <div key={i} style={{ position: 'relative', zIndex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 10, width: 80 }}>
                <div style={{ 
                  width: 44, height: 44, borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center',
                  background: isActive ? 'var(--primary)' : isDone ? 'var(--primary)' : 'white',
                  color: isActive || isDone ? 'white' : 'var(--text-light)',
                  border: `3px solid ${isActive || isDone ? 'var(--primary)' : 'var(--border)'}`,
                  fontWeight: 700, fontSize: 16, transition: 'all 0.3s ease',
                  boxShadow: isActive ? '0 0 0 4px rgba(27,77,62,0.15)' : 'none'

                  {isDone ? <Icon name="check" size={20} /> : s.step}

                <span style={{ fontSize: 13, fontWeight: 700, color: isActive ? 'var(--primary-dark)' : 'var(--text-light)', transition: 'color 0.3s ease' }}>{s.label}</span>
              </div>

          <form onSubmit={handleSubmit}>
            {formStep === 1 && (
              <div className="slide-in" style={{ display: 'flex', flexDirection: 'column', gap: 28 }}>
                <div>
                  <h2 style={{ fontSize: 24, fontWeight: 800, color: 'var(--primary-dark)', marginBottom: 8 }}>
                    {lang === 'ta' ? 'அடிப்படை தகவல்' : 'Basic Information'}
                  </h2>
                  <p style={{ color: 'var(--text-light)', fontSize: 15 }}>{lang === 'ta' ? 'உங்கள் சொத்தின் அடிப்படை விவரங்களை பதிவு செய்யவும்.' : 'Let us know the core details about your property.'}</p>
                </div>
                
                <div>
                  <label style={{ display: 'block', fontSize: 14, fontWeight: 700, color: 'var(--text)', marginBottom: 8 }}>{lang === 'ta' ? 'சொத்து தலைப்பு' : 'Property Title'} <span style={{color: '#EF4444'}}>*</span></label>
                  <input className="input" placeholder={lang === 'ta' ? 'உ.ம்: நல்லூரில் 3 படுக்கையறை வீடு' : 'e.g. 3 Bedroom House in Nallur'} required style={{ padding: '16px', fontSize: 16, borderRadius: 'var(--radius-lg)', background: '#F9FAFB', border: '1.5px solid var(--border)' }} />

                        <Icon name="chevronDown" size={20} />
                      </div>
                    </div>
                  </div>
                  <div>
                    <label style={{ display: 'block', fontSize: 14, fontWeight: 700, color: 'var(--text)', marginBottom: 8 }}>{lang === 'ta' ? 'விற்பனை/வாடகை' : 'Listing Purpose'} <span style={{color: '#EF4444'}}>*</span></label>

                        <Icon name="chevronDown" size={20} />
                      </div>
                    </div>
                  </div>
                </div>

                      <Icon name="chevronDown" size={20} />
                    </div>

                </div>
              </div>

            {formStep === 2 && (
              <div className="slide-in" style={{ display: 'flex', flexDirection: 'column', gap: 28 }}>

                  </h2>
                  <p style={{ color: 'var(--text-light)', fontSize: 15 }}>{lang === 'ta' ? 'உங்கள் சொத்தின் சிறப்பம்சங்களை குறிப்பிடுங்கள்.' : 'Provide the key metrics and features.'}</p>

                  <div style={{ position: 'relative' }}>
                    <span style={{ position: 'absolute', left: 16, top: '50%', transform: 'translateY(-50%)', color: 'var(--text-light)', fontWeight: 700 }}>Rs.</span>
                    <input className="input" type="number" required placeholder="0.00" style={{ padding: '16px 16px 16px 52px', fontSize: 16, borderRadius: 'var(--radius-lg)', background: '#F9FAFB', border: '1.5px solid var(--border)', fontWeight: 600, width: '100%' }} />

                  <div>

                    <div style={{ position: 'relative' }}>
                      <div style={{ position: 'absolute', left: 16, top: '50%', transform: 'translateY(-50%)', color: 'var(--text-light)' }}><Icon name="bath" size={18} /></div>
                      <input className="input" type="number" placeholder="0" style={{ padding: '16px 16px 16px 44px', borderRadius: 'var(--radius-lg)', background: '#F9FAFB', border: '1.5px solid var(--border)', width: '100%' }} />

                    </div>
                  </div>
                  <div>
                    <label style={{ display: 'block', fontSize: 14, fontWeight: 700, color: 'var(--text)', marginBottom: 8 }}>{t('landSize')} ({t('perches')})</label>

                  <textarea className="input" required rows={5} placeholder={lang === 'ta' ? 'சொத்து பற்றிய விரிவான விளக்கம்...' : 'Detailed description of the property...'} style={{ resize: 'vertical', padding: '16px', borderRadius: 'var(--radius-lg)', fontSize: 15, background: '#F9FAFB', border: '1.5px solid var(--border)', width: '100%' }} />

            <div style={{ display: 'flex', gap: 16, marginTop: 40, paddingTop: 32, borderTop: '1px solid var(--border)' }}>

              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  );
}

// MORTGAGE / EMI CALCULATOR
// ─────────────────────────────────────────
function MortgageCalculator() {
  const { lang, t } = useContext(AppContext);
  const [amount, setAmount] = useState(15000000);
  const [rate, setRate] = useState(12);
  const [years, setYears] = useState(20);

  const monthlyRate = rate / 100 / 12;
  const numPayments = years * 12;
  const emi = monthlyRate > 0 ? Math.round((amount * monthlyRate * Math.pow(1 + monthlyRate, numPayments)) / (Math.pow(1 + monthlyRate, numPayments) - 1)) : Math.round(amount / numPayments);
  const totalPayment = emi * numPayments;
  const totalInterest = totalPayment - amount;

  return (
    <section style={{ padding: '80px 0', background: '#F9FAFB' }}>
      <div className="container" style={{ display: 'flex', gap: 48, alignItems: 'center', flexWrap: 'wrap' }}>
        <div style={{ flex: 1, minWidth: 300 }}>
          <h2 className={lang === 'ta' ? 'tamil' : ''} style={{ fontSize: 28, fontWeight: 800, marginBottom: 8 }}>{t('emiCalculator')}</h2>
          <p style={{ color: 'var(--text-light)', marginBottom: 24, lineHeight: 1.7 }}>
            {lang === 'ta' ? 'உங்கள் மாதாந்திர கட்டணத்தை கணக்கிட்டு, உங்கள் வீட்டு கனவை திட்டமிடுங்கள்.' : 'Calculate your monthly payments and plan your home purchase with confidence.'}
          </p>
          <div className="calc-container">
            <div style={{ marginBottom: 20 }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 8 }}><label>{t('loanAmount')}</label><strong>Rs. {(amount / 1000000).toFixed(1)}M</strong></div>
              <input type="range" className="range-slider" min="1000000" max="100000000" step="500000" value={amount} onChange={e => setAmount(Number(e.target.value))} />
            </div>
            <div style={{ marginBottom: 20 }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 8 }}><label>{t('interestRate')}</label><strong>{rate}%</strong></div>
              <input type="range" className="range-slider" min="5" max="25" step="0.5" value={rate} onChange={e => setRate(Number(e.target.value))} />
            </div>
            <div style={{ marginBottom: 8 }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 8 }}><label>{t('loanTerm')}</label><strong>{years} {lang === 'ta' ? 'ஆண்டுகள்' : 'years'}</strong></div>
              <input type="range" className="range-slider" min="1" max="30" step="1" value={years} onChange={e => setYears(Number(e.target.value))} />
            </div>
            <div className="calc-result">
              <div style={{ fontSize: 13, opacity: 0.8, marginBottom: 4 }}>{t('monthlyEmi')}</div>
              <div className="amount">Rs. {emi.toLocaleString()}</div>
              <div style={{ display: 'flex', justifyContent: 'center', gap: 32, marginTop: 12, fontSize: 13, opacity: 0.8 }}>
                <span>{lang === 'ta' ? 'மொத்தம்' : 'Total'}: Rs. {(totalPayment / 1000000).toFixed(1)}M</span>
                <span>{lang === 'ta' ? 'வட்டி' : 'Interest'}: Rs. {(totalInterest / 1000000).toFixed(1)}M</span>
              </div>
            </div>
          </div>
        </div>
        <div style={{ flex: 1, minWidth: 300, display: 'flex', flexDirection: 'column', gap: 16 }}>
          {[
            { icon: '🏦', title: lang === 'ta' ? 'வங்கி கடன் ஆலோசனை' : 'Bank Loan Advisory', desc: lang === 'ta' ? 'இலங்கை வங்கிகளின் சிறந்த வீட்டுக் கடன் விகிதங்கள்' : 'Best home loan rates from Sri Lankan banks' },

// AI CHATBOT
// ─────────────────────────────────────────
function AIChatbot() {
  const { lang, t } = useContext(AppContext);
  const [isOpen, setIsOpen] = useState(false);
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState('');
  const [typing, setTyping] = useState(false);

  useEffect(() => {
    if (isOpen && messages.length === 0) {
      setMessages([{ role: 'bot', text: t('chatbotGreeting') }]);
    }
  }, [isOpen]);

  const botResponses = {
    'find': lang === 'ta' ? 'என்ன வகையான சொத்து தேடுகிறீர்கள்? வீடு, காணி, குடியிருப்பு அல்லது வணிக இடம்? எந்த பகுதி மற்றும் பட்ஜெட்?' : 'What type of property are you looking for? House, land, apartment, or commercial? Which area and budget range?',
    'price': lang === 'ta' ? 'யாழ்ப்பாண சொத்து விலைகள்:\n🏠 வீடுகள்: Rs. 8M - 65M\n🏞️ காணிகள்: Rs. 800K/perch\n🏢 குடியிருப்புகள்: Rs. 12M - 35M\nகுறிப்பிட்ட பகுதி பற்றி கேளுங்கள்!' : 'Jaffna property price ranges:\n🏠 Houses: Rs. 8M - 65M\n🏞️ Land: ~Rs. 800K/perch\n🏢 Apartments: Rs. 12M - 35M\nAsk about a specific area!',
    'tour': lang === 'ta' ? 'நிச்சயமாக! சுற்றுப்பயணம் திட்டமிட, உங்கள் விருப்பமான தேதி, நேரம் மற்றும் தொலைபேசி எண்ணைக் கூறுங்கள். எங்கள் முகவர் 24 மணி நேரத்திற்குள் தொடர்பு கொள்வார்.' : 'Of course! To schedule a tour, please share your preferred date, time, and phone number. Our agent will contact you within 24 hours.',
    'agent': lang === 'ta' ? 'எங்கள் சிறந்த முகவர்களை இணைக்கிறேன்! உங்கள் தொலைபேசி எண்ணை அல்லது மின்னஞ்சலை பகிர்ந்தால், உடனடியாக தொடர்பு கொள்வோம்.' : 'I\'ll connect you with one of our top agents! Share your phone number or email and we\'ll reach out immediately.',
  };

  const handleSend = (text) => {
    const msg = text || input;
    if (!msg.trim()) return;
    setMessages(prev => [...prev, { role: 'user', text: msg }]);
    setInput('');
    setTyping(true);
    setTimeout(() => {
      const lowerMsg = msg.toLowerCase();
      let response = lang === 'ta' ? 'நன்றி! உங்கள் கேள்வியை எங்கள் முகவர் குழுவிற்கு அனுப்புகிறேன். விரைவில் தொடர்பு கொள்வார்கள்.' : 'Thanks! I\'m forwarding your inquiry to our agent team. They\'ll get back to you shortly.';
      if (lowerMsg.includes('find') || lowerMsg.includes('house') || lowerMsg.includes('land') || lowerMsg.includes('வீடு') || lowerMsg.includes('காணி')) response = botResponses['find'];
      else if (lowerMsg.includes('price') || lowerMsg.includes('cost') || lowerMsg.includes('விலை') || lowerMsg.includes('budget')) response = botResponses['price'];
      else if (lowerMsg.includes('tour') || lowerMsg.includes('visit') || lowerMsg.includes('see') || lowerMsg.includes('பார்')) response = botResponses['tour'];
      else if (lowerMsg.includes('agent') || lowerMsg.includes('talk') || lowerMsg.includes('call') || lowerMsg.includes('முகவர்')) response = botResponses['agent'];
      setMessages(prev => [...prev, { role: 'bot', text: response }]);
      setTyping(false);
    }, 1200);
  };

  return (
    <>
      {isOpen && (
        <div className="chatbot-window">
          <div className="chatbot-header">
            <div style={{ width: 40, height: 40, borderRadius: '50%', background: 'rgba(255,255,255,0.2)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 20 }}>🏠</div>
            <div>
              <div style={{ fontWeight: 700 }}>Yaal AI Assistant</div>
              <div style={{ fontSize: 12, opacity: 0.8 }}>{lang === 'ta' ? '24/7 ஆன்லைன்' : '24/7 Online'}</div>
            </div>
            <button onClick={() => setIsOpen(false)} style={{ marginLeft: 'auto', background: 'none', border: 'none', color: 'white', cursor: 'pointer' }}><Icon name="x" size={20} /></button>
          </div>
          <div className="chatbot-messages">
            {messages.map((msg, i) => (
              <div key={i} className={`chat-msg ${msg.role}`} style={{ whiteSpace: 'pre-line' }}>{msg.text}</div>
            ))}
            {typing && <div className="chat-msg bot" style={{ opacity: 0.6 }}>...</div>}
          </div>
          <div className="chat-suggestions">
            {[t('findProperty'), t('checkPrice'), t('bookTour'), t('talkToAgent')].map((s, i) => (
              <button key={i} className="chat-suggestion" onClick={() => handleSend(s)}>{s}</button>
            ))}
          </div>
          <div className="chatbot-input">
            <input className="input" style={{ flex: 1 }} placeholder={t('chatbotPlaceholder')} value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') handleSend(); }} />
            <button onClick={() => handleSend()} className="btn btn-primary btn-sm" style={{ borderRadius: '50%', width: 40, height: 40, padding: 0 }}>
              <Icon name="chevronRight" size={18} color="white" />
            </button>
          </div>
        </div>
      )}
      <button className="chatbot-fab" onClick={() => setIsOpen(!isOpen)}>
        <div className="pulse-ring" />
        {isOpen ? <Icon name="x" size={24} color="white" /> : <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2" strokeLinecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>}
      </button>
    </>
  );
}

// ─────────────────────────────────────────
// RECENTLY VIEWED
// ─────────────────────────────────────────
function RecentlyViewedStrip() {
  const { lang, t, recentlyViewed, setSelectedProperty, setPage } = useContext(AppContext);
  if (!recentlyViewed || recentlyViewed.length === 0) return null;
  return (
    <section className="recently-viewed">
      <div className="container">
        <div style={{ display: 'flex', alignItems: 'center', gap: 16, marginBottom: 12 }}>
          <Icon name="clock" size={16} color="var(--text-light)" />
          <span style={{ fontSize: 14, fontWeight: 600, color: 'var(--text-light)' }}>{t('recentlyViewed')}</span>
        </div>
        <div style={{ overflowX: 'auto', whiteSpace: 'nowrap', paddingBottom: 8 }}>
          {recentlyViewed.slice(0, 5).map(p => (
            <div key={p.id} className="recently-viewed-item" onClick={() => { setSelectedProperty(p); setPage('propertyDetail'); }}>
              <img src={p.images[0]} alt="" />
              <div style={{ minWidth: 0 }}>
                <div style={{ fontSize: 13, fontWeight: 600, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{lang === 'ta' ? p.titleTa : p.title}</div>
                <div style={{ fontSize: 14, fontWeight: 800, color: 'var(--primary)' }}>{formatPrice(p.price, p.listingType, lang)}</div>
              </div>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

// HOME PAGE
// ─────────────────────────────────────────
function HomePage() {
  return (
    <>
      <HeroSection />
      <RecentlyViewedStrip />
      <PopularAreas />
      <FeaturedProperties />
      <NeighborhoodGuide />
      <TestimonialsSection />
      <MortgageCalculator />
      <WhyChooseUs />
      <TopAgentsPreview />
    </>
  );
}

// ─────────────────────────────────────────
// TOAST
// ─────────────────────────────────────────
function Toast({ message, onClose }) {
  useEffect(() => { const t = setTimeout(onClose, 3000); return () => clearTimeout(t); }, []);
  return (
    <div className="toast">
      <Icon name="check" size={18} color="#10B981" />
      <span>{message}</span>
      <button onClick={onClose} style={{ background: 'none', border: 'none', color: 'white', cursor: 'pointer', marginLeft: 8 }}><Icon name="x" size={16} /></button>
    </div>
  );
}

// ─────────────────────────────────────────
// APP
// ─────────────────────────────────────────
function App() {
  const [lang, setLang] = useState('en');
  const [page, setPage] = useState('home');
  const [user, setUser] = useState(null);
  const [showLogin, setShowLogin] = useState(false);
  const [showSignup, setShowSignup] = useState(false);
  const [selectedProperty, setSelectedProperty] = useState(null);
  const [selectedAgent, setSelectedAgent] = useState(null);
  const [searchQuery, setSearchQuery] = useState('');
  const [toast, setToast] = useState('');
  const [showMobileMenu, setShowMobileMenu] = useState(false);
  const [activePathway, setActivePathway] = useState('sale');
  const [recentlyViewed, setRecentlyViewed] = useState([]);

  const t = useCallback((key) => translations[lang][key] || key, [lang]);

  useEffect(() => { window.scrollTo({ top: 0, behavior: 'smooth' }); }, [page]);

  // Track recently viewed properties
  const origSetSelectedProperty = useCallback((prop) => {
    if (prop) {
      setRecentlyViewed(prev => {
        const filtered = prev.filter(p => p.id !== prop.id);
        return [prop, ...filtered].slice(0, 10);
      });
    }
    setSelectedProperty(prop);
  }, []);

  const contextValue = {
    lang, setLang, t, page, setPage, user, setUser,
    showLogin, setShowLogin, showSignup, setShowSignup,
    selectedProperty, setSelectedProperty: origSetSelectedProperty, selectedAgent, setSelectedAgent,
    searchQuery, setSearchQuery, setToast, showMobileMenu, setShowMobileMenu,
    activePathway, setActivePathway, recentlyViewed
  };

  const renderPage = () => {
    switch (page) {
      case 'home': return <HomePage />;
      case 'properties': return <PropertiesPage />;
      case 'map': return <MapPage />;
      case 'agents': return <AgentsPage />;
      case 'agentDetail': return <AgentDetail />;
      case 'propertyDetail': return <PropertyDetail />;
      case 'dashboard': return <DashboardPage />;
      case 'addListing': return <AddListingPage />;
      default: return <HomePage />;
    }
  };

  return (
    <AppContext.Provider value={contextValue}>
      <Navbar />
      <MobileNavDrawer />
      <main style={{ minHeight: '60vh' }}>{renderPage()}</main>
      <Footer />
      {showLogin && <LoginModal />}
      {showSignup && <SignupModal />}
      {toast && <Toast message={toast} onClose={() => setToast('')} />}
      <WhatsAppButton />
      <AIChatbot />
    </AppContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
