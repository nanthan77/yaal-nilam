version: '3.8'

services:
  # ─────────────────────────────────────
  # PostgreSQL Database
  # ─────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    container_name: yaalnilam-db
    environment:
      POSTGRES_DB: yaalnilam
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-yaalnilam_dev_2026}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./database/seed-jaffna.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────
  # Redis (Session Management)
  # ─────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: yaalnilam-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────
  # Node.js WhatsApp Gateway
  # ─────────────────────────────────────
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: yaalnilam-gateway
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD:-yaalnilam_dev_2026}@postgres:5432/yaalnilam
      - REDIS_URL=redis://redis:6379
      - PYTHON_AI_URL=http://ai-service:8000
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./gateway/src:/app/src
      - media_uploads:/app/uploads

  # ─────────────────────────────────────
  # Python AI Microservice
  # ─────────────────────────────────────
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: yaalnilam-ai
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD:-yaalnilam_dev_2026}@postgres:5432/yaalnilam
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./ai-service/app:/app/app
      - chromadb_data:/app/data/chromadb
      - media_uploads:/app/uploads

  # ─────────────────────────────────────
  # Next.js Web Portal
  # ─────────────────────────────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: yaalnilam-web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://gateway:3001
    env_file:
      - .env
    depends_on:
      - gateway

volumes:
  postgres_data:
  chromadb_data:
  media_uploads:
